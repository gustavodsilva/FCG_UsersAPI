# Dados SENSÍVEIS do UsersAPI.
# Os valores abaixo são de DESENVOLVIMENTO, para o desafio rodar em cluster local.
# Em ambiente real, nunca versione segredos: use Sealed Secrets, External Secrets,
# Azure Key Vault etc. Com stringData não é preciso codificar em base64.
apiVersion: v1
kind: Secret
metadata:
  name: users-api-secret
  labels:
    app: users-api
type: Opaque
stringData:
  ConnectionStrings__SqlConnection: "Server=users-db,1433;Database=FcgUsersDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;"
  Jwt__SecretKey: "chave-secreta-de-desenvolvimento-fiap-cloud-games-2026"
  RabbitMq__Username: "guest"
  RabbitMq__Password: "guest"
  # Usado pelo SQL Server do próprio UsersAPI (users-db.yaml). Mantenha igual à
  # senha da connection string acima.
  MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
